<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - ChoshmaZone</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #0d0d0d; --dark-card: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Hind Siliguri', sans-serif; background: var(--dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        body::before { content:''; position:absolute; width:400px; height:400px; background:var(--gold); border-radius:50%; filter:blur(80px); opacity:0.12; top:-100px; left:-100px; animation: float 8s ease-in-out infinite; }
        body::after { content:''; position:absolute; width:300px; height:300px; background:#8B6914; border-radius:50%; filter:blur(80px); opacity:0.12; bottom:-80px; right:-80px; animation: float 8s ease-in-out infinite 4s; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(20px)} }
        .auth-wrapper { width:100%; max-width:440px; padding:20px; position:relative; z-index:10; }
        .auth-card { background:var(--dark-card); border:1px solid rgba(212,175,55,0.2); border-radius:16px; padding:40px; box-shadow:0 25px 60px rgba(0,0,0,0.5); }
        .auth-logo { text-align:center; margin-bottom:28px; }
        .auth-logo img { height:55px; filter:brightness(0) invert(1); }
        .auth-title { font-family:'Playfair Display',serif; color:#fff; font-size:1.8rem; font-weight:700; margin-bottom:5px; }
        .auth-subtitle { color:#888; font-size:0.9rem; margin-bottom:26px; }
        .divider { height:1px; background:rgba(255,255,255,0.08); margin:20px 0; }
        .form-label { color:#ccc; font-size:0.9rem; font-weight:500; margin-bottom:6px; display:block; }
        .form-control { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#fff; padding:12px 16px; border-radius:8px; width:100%; font-family:'Hind Siliguri',sans-serif; transition:all 0.3s; }
        .form-control:focus { background:rgba(255,255,255,0.09); border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,0.15); outline:none; color:#fff; }
        .form-control::placeholder { color:#555; }
        .input-group { display:flex; }
        .input-group-text { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-right:none; color:#888; padding:0 14px; border-radius:8px 0 0 8px; display:flex; align-items:center; }
        .input-group .form-control { border-left:none; border-radius:0 8px 8px 0; }
        .toggle-pw { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-left:none; color:#888; cursor:pointer; padding:0 14px; border-radius:0 8px 8px 0; }
        .btn-gold { background:var(--gold); color:#000; font-weight:700; padding:13px; border:none; border-radius:8px; font-family:'Hind Siliguri',sans-serif; font-size:1rem; width:100%; transition:all 0.3s; cursor:pointer; }
        .btn-gold:hover { background:#b8962d; transform:translateY(-2px); box-shadow:0 8px 20px rgba(212,175,55,0.3); }
        .auth-link { color:var(--gold); text-decoration:none; font-weight:600; }
        .auth-link:hover { color:#f0cb50; }
        .forgot-link { text-align:right; margin-top:6px; }
        .forgot-link a { color:#666; font-size:0.85rem; text-decoration:none; }
        .forgot-link a:hover { color:var(--gold); }
        .home-link { text-align:center; margin-top:20px; }
        .home-link a { color:#666; text-decoration:none; font-size:0.85rem; }
        .home-link a:hover { color:var(--gold); }
    </style>
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="assets/images/logo.png" alt="ChoshmaZone">
        </div>
        <div class="auth-title">স্বাগতম! 👋</div>
        <div class="auth-subtitle">আপনার অ্যাকাউন্টে লগইন করুন</div>
        <form id="login-form">
            <div class="mb-3">
                <label class="form-label">ইমেইল</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="example@email.com">
                </div>
            </div>
            <div class="mb-1">
                <label class="form-label">পাসওয়ার্ড</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="আপনার পাসওয়ার্ড">
                    <button type="button" class="toggle-pw" onclick="togglePw('password','eye1')"><i class="fas fa-eye" id="eye1"></i></button>
                </div>
            </div>
            <div class="forgot-link"><a href="#">পাসওয়ার্ড ভুলে গেছেন?</a></div>
            <div class="divider"></div>
            <button type="submit" class="btn-gold"><i class="fas fa-sign-in-alt me-2"></i> লগইন করুন</button>
        </form>
        <p class="text-center mt-4" style="color:#888; font-size:0.9rem;">
            অ্যাকাউন্ট নেই? <a href="register_preview.html" class="auth-link">রেজিস্টার করুন</a>
        </p>
    </div>
    <div class="home-link"><a href="preview.html"><i class="fas fa-arrow-left me-1"></i> হোমে ফিরুন</a></div>
</div>
<script>
function togglePw(id, eyeId) {
    const inp = document.getElementById(id);
    document.getElementById(eyeId).classList.toggle('fa-eye');
    document.getElementById(eyeId).classList.toggle('fa-eye-slash');
    inp.type = inp.type === 'password' ? 'text' : 'password';
}
document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    alert('লগইন সফল! (ডেমো মোড)');
    window.location.href = 'preview.html';
});
</script>
</body>
</html>
