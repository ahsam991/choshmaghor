<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - ChoshmaZone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <span><i class="fas fa-phone me-2"></i>01700-000000</span>
                <span class="ms-3"><i class="fas fa-envelope me-2"></i>info@choshmazone.com</span>
            </div>
            <div class="col-md-6 text-end">
                <a href="#" class="text-white me-2"><i class="fas fa-sign-in-alt me-1"></i>লগইন</a>
                <a href="#" class="text-white"><i class="fas fa-user-plus me-1"></i>রেজিস্টার</a>
            </div>
        </div>
    </div>
</div>

<!-- Main Header -->
<header class="main-header sticky-top">
    <div class="container">
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand" href="preview.html">
                <img src="assets/images/logo.png" alt="ChoshmaZone Logo" style="height: 60px; object-fit: contain;">
            </a>
            <div class="nav-right d-flex align-items-center gap-3 ms-auto">
                <a href="#" class="nav-icon-btn cart-btn text-dark text-decoration-none">
                    <i class="fas fa-shopping-bag fa-lg"></i>
                    <span class="badge bg-danger rounded-circle" id="cart-count">0</span>
                </a>
            </div>
        </nav>
    </div>
</header>

<main>
    <div class="shop-page">
        <!-- Shop Header -->
        <div class="page-header">
            <div class="container">
                <h1>শপ (Shop)</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="preview.html">হোম</a></li>
                        <li class="breadcrumb-item active text-white">শপ</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="container py-4">
            <div class="row">
                <!-- Sidebar Filters -->
                <div class="col-lg-3">
                    <div class="filter-sidebar">
                        <h5 class="filter-title"><i class="fas fa-filter me-2"></i>ফিল্টার</h5>
                        <form>
                            <div class="filter-section">
                                <label>খুঁজুন</label>
                                <input type="text" class="form-control" placeholder="পণ্যের নাম...">
                            </div>
                            <div class="filter-section">
                                <label>ক্যাটাগরি</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" checked>
                                    <label class="form-check-label">Men Sunglasses</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox">
                                    <label class="form-check-label">Women Sunglasses</label>
                                </div>
                            </div>
                            <div class="filter-section">
                                <label>মূল্য পরিসীমা</label>
                                <div class="d-flex gap-2">
                                    <input type="number" class="form-control" placeholder="Min">
                                    <input type="number" class="form-control" placeholder="Max">
                                </div>
                            </div>
                            <button type="button" class="btn btn-gold w-100 mt-2">ফিল্টার করুন</button>
                        </form>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="col-lg-9">
                    <div class="shop-toolbar d-flex justify-content-between align-items-center mb-3">
                        <p class="mb-0">৩ টি পণ্য পাওয়া গেছে</p>
                        <select class="form-select form-select-sm w-auto">
                            <option>নতুন আগমন</option>
                            <option>কম দামে প্রথম</option>
                            <option>বেশি দামে প্রথম</option>
                        </select>
                    </div>

                    <div class="row g-3">
                        <!-- Product 1 -->
                        <div class="col-6 col-md-4">
                            <div class="product-card">
                                <div class="product-badge">20% OFF</div>
                                <div class="product-badge-featured">⭐</div>
                                <div class="product-img-wrap">
                                    <img src="assets/images/logo.png" alt="Classic Aviator" style="opacity: 0.3;">
                                    <div class="product-actions">
                                        <button class="action-btn btn-add-cart" data-id="1"><i class="fas fa-shopping-bag"></i></button>
                                        <button class="action-btn"><i class="fas fa-eye"></i></button>
                                    </div>
                                </div>
                                <div class="product-info">
                                    <span class="product-brand">RayBan</span>
                                    <h6 class="product-name"><a href="#">Classic Aviator</a></h6>
                                    <div class="product-price">
                                        <span class="price-sale">৳১,২০০</span>
                                        <span class="price-original">৳১,৫০০</span>
                                    </div>
                                    <span class="stock-badge in">স্টক আছে</span>
                                </div>
                            </div>
                        </div>
                        <!-- Product 2 -->
                        <div class="col-6 col-md-4">
                            <div class="product-card">
                                <div class="product-img-wrap">
                                    <img src="assets/images/logo.png" alt="Retro Square" style="opacity: 0.3;">
                                    <div class="product-actions">
                                        <button class="action-btn btn-add-cart" data-id="2"><i class="fas fa-shopping-bag"></i></button>
                                        <button class="action-btn"><i class="fas fa-eye"></i></button>
                                    </div>
                                </div>
                                <div class="product-info">
                                    <span class="product-brand">Gucci</span>
                                    <h6 class="product-name"><a href="#">Retro Square</a></h6>
                                    <div class="product-price">
                                        <span class="price-regular">৳১,২০০</span>
                                    </div>
                                    <span class="stock-badge in">স্টক আছে</span>
                                </div>
                            </div>
                        </div>
                        <!-- Product 3 -->
                        <div class="col-6 col-md-4">
                            <div class="product-card">
                                <div class="product-badge-featured">⭐</div>
                                <div class="product-img-wrap">
                                    <img src="assets/images/logo.png" alt="Sporty Wrap" style="opacity: 0.3;">
                                    <div class="product-actions">
                                        <button class="action-btn btn-add-cart" data-id="3"><i class="fas fa-shopping-bag"></i></button>
                                        <button class="action-btn"><i class="fas fa-eye"></i></button>
                                    </div>
                                </div>
                                <div class="product-info">
                                    <span class="product-brand">Oakley</span>
                                    <h6 class="product-name"><a href="#">Sporty Wrap</a></h6>
                                    <div class="product-price">
                                        <span class="price-sale">৳১,৮০০</span>
                                        <span class="price-original">৳২,০০০</span>
                                    </div>
                                    <span class="stock-badge out">স্টক শেষ</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="main-footer">
    <div class="container text-center">
        <img src="assets/images/logo.png" alt="Logo" style="height: 40px; filter: brightness(0) invert(1); margin-bottom: 20px;">
        <p class="text-secondary">&copy; 2026 ChoshmaZone. All rights reserved.</p>
    </div>
</footer>

<script src="assets/js/app.js"></script>
</body>
</html>
